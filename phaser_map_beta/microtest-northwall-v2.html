<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ragbia Pixel — M002.2B.0.2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050806;overflow:hidden}
    #game-root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    canvas{image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
    #diag{position:fixed;left:18px;top:18px;max-width:min(820px,calc(100% - 36px));box-sizing:border-box;color:#f2f5ee;background:#111a16;border:2px solid #6f9475;padding:14px 18px;z-index:9999;font:16px/1.4 Consolas,monospace;white-space:pre-wrap}
    #diag.ok{display:none}
    #diag.err{color:#fff0e7;border-color:#d97858;background:#23120e}
    #start-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5000;background:radial-gradient(circle at 50% 38%,#17261c 0,#0b130e 42%,#050806 76%);color:#f4f3df}
    #start-screen.ready{display:flex}
    #start-card{width:min(520px,calc(100% - 48px));box-sizing:border-box;padding:34px 38px 32px;background:#0b120f;border:3px solid #6f9475;text-align:center}
    #start-title{margin:0 0 8px;font:700 31px/1.1 Georgia,serif;letter-spacing:1px;color:#f3e6b6}
    #start-subtitle{margin:0 0 24px;font:15px/1.45 Consolas,monospace;color:#aebdad}
    #character-name{width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #536d59;background:#101a14;color:#f7f2d8;font:18px/1.2 Consolas,monospace;outline:none;text-align:center}
    #play-button{width:100%;margin-top:14px;padding:12px 14px;border:2px solid #a78d55;background:#604a27;color:#fff2c7;font:700 18px/1.2 Consolas,monospace;cursor:pointer}
    #start-error{min-height:22px;margin:10px 0 0;color:#ef9a78;font:15px/1.3 Consolas,monospace}
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="start-screen" aria-hidden="true">
    <div id="start-card">
      <h1 id="start-title">M002.2B.0.2</h1>
      <p id="start-subtitle">Escala humana.<br>Janela mais baixa e lareira mais contida.</p>
      <input id="character-name" type="text" autocomplete="off" spellcheck="false" placeholder="Nome do personagem" aria-label="Nome do personagem" />
      <button id="play-button" type="button">Jogar microteste</button>
      <p id="start-error" role="alert"></p>
    </div>
  </div>
  <div id="diag">Ragbia Pixel — carregando microteste…</div>

  <script>
    (() => {
      const el = document.getElementById('diag');
      let done = false;
      const fail = (msg) => { done = true; el.className = 'err'; el.textContent = 'ERRO — M002.2B.0.2\n\n' + msg; };
      window.RagbiaBoot = {
        ready(msg){ done = true; el.className = 'ok'; el.textContent = msg || 'Pronto'; },
        ok(msg){ done = true; el.className = 'ok'; el.textContent = msg || 'OK'; },
        fail
      };
      window.addEventListener('error', e => fail((e.message || 'Erro desconhecido') + (e.filename ? `\n${e.filename}:${e.lineno || 0}:${e.colno || 0}` : '')));
      window.addEventListener('unhandledrejection', e => fail(String(e.reason || 'Promise rejeitada')));
      setTimeout(() => { if (!done) fail('Timeout de inicialização.'); }, 8000);
    })();
  </script>

  <script src="vendor/phaser.min.js" onerror="RagbiaBoot.fail('Phaser não foi carregado.')"></script>
  <script src="player-state-v0.js"></script>
  <script src="apprentice-art-v0.js"></script>
  <script src="microtest-northwall-art-v2.js"></script>
  <script src="microtest-northwall-collision-v2.js"></script>
  <script>
    if (typeof Phaser === 'undefined') RagbiaBoot.fail('window.Phaser ausente.');
    else if (typeof RagbiaPlayerStateV0 === 'undefined') RagbiaBoot.fail('RagbiaPlayerStateV0 ausente.');
    else if (typeof RagbiaApprenticeArtV0 === 'undefined') RagbiaBoot.fail('RagbiaApprenticeArtV0 ausente.');
    else if (typeof RagbiaMicrotestArtV2 === 'undefined') RagbiaBoot.fail('RagbiaMicrotestArtV2 ausente.');
    else if (typeof RagbiaMicrotestCollisionV2 === 'undefined') RagbiaBoot.fail('RagbiaMicrotestCollisionV2 ausente.');
    else {
      const s = document.createElement('script');
      s.src = 'microtest-northwall-scene-v2.js';
      s.onerror = () => RagbiaBoot.fail('microtest-northwall-scene-v2.js não carregou.');
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
